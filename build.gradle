plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Minecraft 1.21.1 ships Java 21 to end users, so the mod targets Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // NeoForge for Minecraft 1.21.1.
    version = neo_version

    parchment {
        mappingsVersion = parchment_mappings_version
        minecraftVersion = parchment_minecraft_version
    }

    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        // Launches GameTestServer, runs all registered gametests, then exits. Handy as a headless
        // "does the mod load" check.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    flatDir {
        dirs 'libs'
    }

    mavenCentral()

    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }

    maven {
        name = 'Kotlin for Forge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
        content {
            includeGroup 'thedarkcolour'
        }
    }

    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex("software\\.bernie.*")
            includeGroup("com.eliotlash.mclib")
        }
    }

    maven {
        name = 'Jared (JEI)'
        url = 'https://maven.blamejared.com/'
        content {
            includeGroup 'mezz.jei'
            includeGroupByRegex 'net\\.mezzdev.*'
        }
    }
}

dependencies {
    // Superb Warfare 0.8.9.1-hotfix for 1.21.1 (Modrinth version id). It nests GeckoLib, Curios,
    // Cloth Config, Flywheel, Ponder and SimpleBedrockModel, which NeoForge loads at runtime.
    implementation "maven.modrinth:superb-warfare:${superbwarfare_version}"

    // GeckoLib is nested in Superb Warfare at runtime; this is for compiling against it.
    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"

    // Kotlin for Forge - Superb Warfare's mod loader.
    implementation "thedarkcolour:kotlinforforge-neoforge:${kff_version}"

    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
}

// Expands the properties below in the mod metadata. Missing properties are an error.
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            neo_version: neo_version, neo_version_range: neo_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    options.compilerArgs += ['-Xmaxerrs', '10000']
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// ============================================================================
// Vehicle creative-tab icon renderer (build-time, isometric).
// Renders each vehicle's .geo.json model to a 128x128 isometric PNG at
// assets/superbwarfare/textures/vehicle_icon/container/<id>.png, which FCP's
// container-icon decorator picks up (no code/JSON changes needed).
//
// The renderer is a small Rust program in tools/icon_renderer (all ~200 icons in
// about a second). The generated icons are committed to the repo, so a machine
// without Rust still builds fine - the task is skipped and the committed icons are
// used. Run by hand with:
//     ./gradlew renderVehicleIcons
// Requires cargo (https://rustup.rs). See tools/RENDER_ICONS_README.md.
// ============================================================================
tasks.register('renderVehicleIcons', Exec) {
    group = 'fcp'
    description = 'Render isometric creative-tab icons for all vehicles from their geo models.'
    def crate = file('tools/icon_renderer')
    def outDir = file('src/main/resources/assets/superbwarfare/textures/vehicle_icon/container')
    inputs.files fileTree(crate) { include 'Cargo.toml', 'Cargo.lock', 'src/**' }
    inputs.file file('tools/icon_overrides.json')
    inputs.dir file('src/main/resources/assets/fcp/geo')
    inputs.files fileTree(file('src/main/resources/assets/fcp/textures/entity'))
    inputs.files fileTree(file('src/main/resources/assets/fcp/sbw'))
    inputs.files fileTree(file('src/main/resources/data')) { include '*/sbw/vehicle_skins/*.json' }
    // The geo each vehicle uses is read from the model classes and the entity registrations.
    inputs.file file('src/main/java/frontline/combat/fcp/init/ModEntities.java')
    inputs.files fileTree(file('src/main/java/frontline/combat/fcp/client/model'))
    outputs.dir outDir
    def cargo = System.getenv('CARGO') ?: 'cargo'
    // Only run when cargo is actually available, so a machine without Rust never breaks the
    // build (the committed icons are used as-is).
    onlyIf {
        try {
            def p = [cargo, '--version'].execute()
            p.waitFor() == 0
        } catch (ignored) { false }
    }
    commandLine cargo, 'run', '--release', '--quiet', '--manifest-path', new File(crate, 'Cargo.toml').absolutePath,
            '--', '--batch', projectDir.absolutePath
}

// Regenerate icons as part of the build. Gradle skips it when nothing changed (up-to-date),
// and the onlyIf above skips it when cargo isn't installed.
tasks.named('processResources').configure { dependsOn 'renderVehicleIcons' }

